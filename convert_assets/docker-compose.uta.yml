services:
  # Universal Transcript Archive (UTA) PostgreSQL database container
  # Runs the full UTA schema and alignments locally for offline, high-throughput HGVS mapping.
  uta:
    image: biocommons/uta:latest
    container_name: uta_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - uta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/uta-ready && psql -U anonymous -d uta -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  uta_data:
