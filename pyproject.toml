[project]
name = "evoproject"
version = "0.1.0"
description = "Genomic sequence embedding extraction and variant difference analysis using Evo2"
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
    { name = "Tian", email = "tianh@gmail.com" },
]
license = { text = "MIT" }
keywords = ["genomics", "evo2", "embeddings", "bioinformatics", "dna"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "biopython>=1.80",
    "evo2>=0.6.0",
    "flash-attn",
    "hgvs>=1.5.7",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=3.1.1",
    "torch>=2.2.0",
]

[project.optional-dependencies]
cuda = [
    "flash-attn>=2.8.0",
]
dev = [
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.0.0",
    "jupyterlab>=4.0.0",
    "notebook>=7.0.0",
]

[project.scripts]
extract-embedding = "extract_embeding:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["extract_embeding"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121" }
]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.7.4.post1/flash_attn-2.7.4.post1+cu12torch2.5cxx11abiFALSE-cp312-cp312-linux_x86_64.whl" }

